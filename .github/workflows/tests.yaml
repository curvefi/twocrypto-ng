name: tests

on: [push, pull_request]

jobs:
  tests:
    name: ${{ matrix.suite.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: unit
            args: tests/unitary --ignore=tests/unitary/pool/stateful --ignore=tests/unitary/math
          - name: stateful
            args: tests/unitary/pool/stateful --ignore=tests/unitary/pool/stateful/legacy
          - name: math
            args: tests/unitary/math
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Install Vyper 0.3.10 for the legacy factory and gauge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -c "import vvm; vvm.install_vyper('0.3.10')"

      - name: Run tests
        run: uv run pytest ${{ matrix.suite.args }} -n auto

  integration:
    # Needs the RPC_ETHEREUM secret, which pull requests from forks do not get.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Install Vyper 0.3.10 for the legacy factory and gauge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -c "import vvm; vvm.install_vyper('0.3.10')"

      - name: Run integration tests
        run: uv run pytest tests/integration/test_create2_deployment.py
