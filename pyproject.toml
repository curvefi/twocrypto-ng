[project]
name = "twocrypto-ng"
version = "2.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vyper==0.4.3rc1",
    "titanoboa",
]

[tool.uv.sources]
titanoboa = { git = "https://github.com/vyperlang/titanoboa.git", rev = "40e85c602aa2c15baaf5060547c1224178d9efae" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "pytest-forked",
    "pytest-repeat",
    "hypothesis==6.74.0",
    "eip712",
    "eth-account",
    "pandas",
    "cytoolz",
]
